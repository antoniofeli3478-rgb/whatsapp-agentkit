# Catálogo da Anima Kids Park — o que o agente conhece e pode sugerir
#
# Montado em 25/10/2026 a partir do site animakidsfestas.com.br e do Instagram @animakidspark.
# O que ainda NÃO sabemos fica em branco (null) e o agente diz que "a equipe confirma":
#   preco          -> o agente nunca fala valor (regras.yaml: mostrar_precos: false)
#   medidas        -> só alguns brinquedos têm ficha; os outros, a equipe confirma pelo espaço
#   quantidade     -> quantas unidades existem (null = não sabemos)
#
# Campos de cada item:
#   id             nome curto e único, sem espaço (o agente usa para pedir foto e detalhes)
#   nome           como o cliente vê
#   linha          kid-play | pocket | baby | toboga | circuito | esportivo | tradicional | jogos | agua | alimentacao
#   ativo          false = está no site, mas o agente NÃO oferece
#   sob_consulta   true = o agente não oferece; se o cliente pedir, anota para a equipe decidir
#   idade          [mínima, máxima] sugerida (fonte: faixas do site; a equipe confirma)
#   aquatico       nao | sim | opcional
#   medidas_m      comprimento x largura x altura do brinquedo, em metros
#   area_m         espaço recomendado para montar (com folga), em metros
#   capacidade     crianças ao mesmo tempo
#   destaque       uma frase para o agente usar (do jeito da empresa)
#   fotos          links públicos do site da empresa

